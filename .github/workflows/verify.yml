name: Verify scientific record

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r verification/requirements.txt
      - name: Test the verification wrapper
        run: python -m unittest discover -s verification -p 'test_*.py' -v
      - name: Verify navigation, learning map and finite results
        run: python verification/run_all.py
