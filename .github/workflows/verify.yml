name: Verify scientific record

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned numerical dependencies
        run: python -m pip install -r verification/requirements.txt
      - name: Test the verification wrapper
        run: python -m unittest discover -s verification -p 'test_*.py' -v
      - name: Verify navigation, learning map and finite results
        run: python verification/run_all.py
      - name: Show numerical diagnostics on failure
        if: failure()
        run: |
          for log in verification/generated/*.stdout.txt verification/generated/*.stderr.txt; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              cat "$log"
            fi
          done
